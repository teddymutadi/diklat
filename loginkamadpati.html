<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELATIHAN KEPALA MADRASAH - KKMI Pati</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange-primary: #F97316;
            --orange-dark: #EA580C;
            --orange-light: #FFF7ED;
            --orange-100: #FFEDD5;
            --orange-200: #FED7AA;
            --orange-300: #FDBA74;
            --orange-400: #FB923C;
            --white: #FFFFFF;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray-50);
            min-height: 100vh;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Background Pattern Minimalis */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            background-image: 
                linear-gradient(rgba(249,115,22,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(249,115,22,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(249,115,22,0.05) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }

        /* Login Container */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: var(--white);
            border-radius: 20px;
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--orange-primary), var(--orange-300), var(--orange-primary));
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 200% 0%; }
        }

        /* Card Header */
        .card-header {
            padding: 48px 40px 24px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--gray-900);
            letter-spacing: -0.03em;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .card-header h1 span {
            background: linear-gradient(135deg, var(--orange-primary), var(--orange-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-header .subtitle {
            font-size: 14px;
            color: var(--gray-500);
            line-height: 1.6;
            font-weight: 400;
        }

        /* Card Body */
        .card-body {
            padding: 0 40px 40px;
        }

        /* Error Message */
        .error-message {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 10px;
            margin-bottom: 20px;
            animation: shake 0.5s ease-in-out, fadeIn 0.3s ease;
        }

        .error-message.show {
            display: flex;
        }

        .error-message i {
            color: #EF4444;
            font-size: 16px;
            flex-shrink: 0;
        }

        .error-message span {
            font-size: 13px;
            color: #991B1B;
            font-weight: 500;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 50%, 90% { transform: translateX(-4px); }
            30%, 70% { transform: translateX(4px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Group */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 8px;
            letter-spacing: 0.01em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 14px;
            transition: color 0.3s;
        }

        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 44px;
            border: 1.5px solid var(--gray-200);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--gray-800);
            background: var(--gray-50);
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:hover {
            border-color: var(--gray-300);
            background: var(--white);
        }

        .form-input:focus {
            border-color: var(--orange-primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(249,115,22,0.1);
        }

        .form-input:focus + i.input-icon {
            color: var(--orange-primary);
        }

        .form-input.error {
            border-color: #EF4444;
            background: #FEF2F2;
        }

        .form-input.error:focus {
            box-shadow: 0 0 0 4px rgba(239,68,68,0.1);
        }

        /* Capslock Warning */
        .capslock-warning {
            display: none;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 12px;
            color: #F59E0B;
        }

        .capslock-warning.show {
            display: flex;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--orange-primary), var(--orange-dark));
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(249,115,22,0.25);
            letter-spacing: 0.01em;
            margin-top: 32px;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(249,115,22,0.35);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .btn-login.loading {
            pointer-events: none;
            opacity: 0.9;
        }

        .btn-login .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        .btn-login.loading .btn-text,
        .btn-login.loading .btn-icon {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success Overlay */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.95);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        .success-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #22C55E, #16A34A);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: success-pop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 8px 24px rgba(34,197,94,0.3);
        }

        .success-icon i {
            font-size: 32px;
            color: white;
        }

        @keyframes success-pop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .success-text {
            text-align: center;
        }

        .success-text h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 6px;
        }

        .success-text p {
            font-size: 14px;
            color: var(--gray-500);
        }

        /* Footer */
        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--gray-400);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card-header {
                padding: 40px 24px 24px;
            }
            .card-body {
                padding: 0 24px 32px;
            }
            .card-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-pattern"></div>
    <div class="bg-glow"></div>

    <main class="login-container">
        <div class="login-card">
            
            <div class="card-header">
                <h1>PELATIHAN <span>KEPALA MADRASAH</span></h1>
                <p class="subtitle">Kelompok Kerja Madrasah Ibtida'iyah (KKMI)<br>Pati Tahun 2026</p>
            </div>

            <div class="card-body">
                <!-- Error Alert -->
                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">Username atau password salah!</span>
                </div>

                <form id="loginForm" onsubmit="return handleLogin(event)">
                    
                    <!-- Username -->
                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="username" 
                                class="form-input" 
                                placeholder="Masukkan username"
                                autocomplete="off"
                            >
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                class="form-input" 
                                placeholder="Masukkan password"
                                onkeyup="checkCapsLock(event)"
                            >
                            <i class="fas fa-lock input-icon"></i>
                        </div>
                        <div class="capslock-warning" id="capslockWarning">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span>Caps Lock aktif</span>
                        </div>
                    </div>

                    <!-- Button -->
                    <button type="submit" class="btn-login" id="loginBtn">
                        <span class="btn-text">Masuk</span>
                        <i class="fas fa-arrow-right btn-icon"></i>
                        <div class="spinner"></div>
                    </button>
                </form>
            </div>
        </div>

        <div class="footer-text">
            &copy; 2026 KKMI Kabupaten Pati. All rights reserved.
        </div>
    </main>

    <!-- Overlay Sukses -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <div class="success-text">
            <h3>Login Berhasil</h3>
            <p>Membuka dashboard pelatihan...</p>
        </div>
    </div>

    <script>
        // Cek Capslock
        function checkCapsLock(event) {
            const warning = document.getElementById('capslockWarning');
            if (event.getModifierState && event.getModifierState('CapsLock')) {
                warning.classList.add('show');
            } else {
                warning.classList.remove('show');
            }
        }

        // Hapus styling error saat mulai mengetik
        document.getElementById('username').addEventListener('input', function() {
            this.classList.remove('error');
            document.getElementById('errorMessage').classList.remove('show');
        });

        document.getElementById('password').addEventListener('input', function() {
            this.classList.remove('error');
            document.getElementById('errorMessage').classList.remove('show');
        });

        // Handle Login Process
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            // Reset Form Error State
            errorMessage.classList.remove('show');
            usernameInput.classList.remove('error');
            passwordInput.classList.remove('error');

            // Validasi Kosong
            if (!username) {
                errorText.textContent = 'Username tidak boleh kosong!';
                errorMessage.classList.add('show');
                usernameInput.classList.add('error');
                usernameInput.focus();
                return false;
            }

            if (!password) {
                errorText.textContent = 'Password tidak boleh kosong!';
                errorMessage.classList.add('show');
                passwordInput.classList.add('error');
                passwordInput.focus();
                return false;
            }

            // Aktifkan Loading Spinner
            loginBtn.classList.add('loading');

            // Simulasi proses delay
            setTimeout(() => {
                if (username === 'admin' && password === '12345678') {
                    // Jika Login Berhasil
                    loginBtn.classList.remove('loading');
                    document.getElementById('successOverlay').classList.add('show');

                    // Tunggu sebentar lalu Redirect ke URL tujuan
                    setTimeout(() => {
                        window.location.href = 'https://script.google.com/macros/s/AKfycbwU_7dyOByUoTfjA_cfJ-tYZ6Qn-XKTQMHaJ5U33NgbbFqa1oTAUV-pYoBL_01KWTp4Fw/exec';
                    }, 1500);
                } else {
                    // Jika Login Gagal
                    loginBtn.classList.remove('loading');
                    errorText.textContent = 'Username atau password salah!';
                    errorMessage.classList.add('show');
                    
                    usernameInput.classList.add('error');
                    passwordInput.classList.add('error');
                    
                    passwordInput.value = ''; // Kosongkan password
                    passwordInput.focus();
                }
            }, 1000); // 1 detik loading animasi

            return false;
        }

        // Auto-focus ke input username saat halaman dimuat
        window.onload = function() {
            setTimeout(() => {
                document.getElementById('username').focus();
            }, 300);
        };
    </script>
</body>
</html>
